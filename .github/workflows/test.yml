name: test
on: [push, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v
      - run: python make_sample.py
      - name: Reports on the sample files
        shell: python
        run: |
          import subprocess, sys
          def run(name):
              return subprocess.run([sys.executable, "pycheck.py", "sample/" + name], capture_output=True, text=True)
          good = run("good.py")
          assert good.returncode == 0 and "No syntax errors found" in good.stdout, good.stdout
          for name, line in (("colon.py", "on line 4"), ("indent.py", "on line 5")):
              out = run(name)
              assert out.returncode == 1 and line in out.stdout, (name, out.stdout)
          print("Sample script reports checked.")
